name: CI — Gestion Stock

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — LINT : Compilation stricte avec warnings
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: 🔎 Compile avec warnings (-Xlint)
        run: ./mvnw compile -Dmaven.compiler.showWarnings=true -Dmaven.compiler.compilerArgument=-Xlint:all

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — TEST : Tests unitaires (aucune BDD requise)
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: 📦 Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: ✅ Run tests
        run: ./mvnw test

      - name: 📊 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ci_cd/test-reports/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — PACKAGE : Build du JAR (push sur main uniquement)
  # ───────────────────────────────────────────────────────────────────────────
  package:
    name: 📦 Package JAR
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: 📦 Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: 🗜️ Build JAR
        run: ./mvnw package -DskipTests

      - name: 🚀 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-jar
          path: target/gestion-stock-1.0.0.jar
          retention-days: 30
