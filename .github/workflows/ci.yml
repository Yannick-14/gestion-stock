name: CI — Gestion Stock

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 : Compilation + Tests unitaires
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🏗️ Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ 21 ]

    steps:
      # 1. Checkout du code source
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de Java
      - name: ☕ Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # 3. Cache des dépendances téléchargées
      - name: 📦 Cache JUnit standalone JAR
        uses: actions/cache@v4
        id: cache-junit
        with:
          path: inventory/lib/junit-platform-console-standalone-1.10.2.jar
          key: junit-5-10-2

      # 4. Téléchargement de JUnit si absent du cache
      - name: ⬇️ Download JUnit Platform Console Standalone
        if: steps.cache-junit.outputs.cache-hit != 'true'
        run: |
          curl -L \
            "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar" \
            -o inventory/lib/junit-platform-console-standalone-1.10.2.jar

      # 5. Compilation des sources principales
      - name: 🔨 Compile main sources
        run: |
          mkdir -p out
          find inventory -name "*.java" -not -path "*/lib/*" > sources.txt
          javac \
            -cp "inventory/lib/postgresql-42.3.7.jar" \
            -d out \
            @sources.txt

      # 6. Compilation des tests (depuis ci_cd/tests comme racine source)
      #    ArticleTest.java déclare package inventory.models
      #    => out/inventory/models/ArticleTest.class  (aucune BDD requise)
      - name: 🧪 Compile test sources
        run: |
          cd ci_cd/tests && javac \
            -cp "../../out:../../inventory/lib/junit-platform-console-standalone-1.10.2.jar" \
            -d "../../out" \
            inventory/models/ArticleTest.java

      # 7. Exécution des tests (zéro connexion BDD — Article est un POJO pur)
      - name: ✅ Run unit tests (no database needed)
        run: |
          java -jar inventory/lib/junit-platform-console-standalone-1.10.2.jar execute \
            --class-path "out" \
            --select-class inventory.models.ArticleTest \
            --reports-dir ci_cd/test-reports \
            --fail-if-no-tests

      # 8. Publication des résultats de test (même en cas d'échec)
      - name: 📊 Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java }}
          path: ci-cd/test-reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 : Construction du JAR (uniquement sur push vers main)
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: 📦 Package JAR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: 🔨 Compile all sources
        run: |
          mkdir -p out
          find inventory -name "*.java" > sources.txt
          javac \
            -cp "inventory/lib/postgresql-42.3.7.jar" \
            -d out \
            @sources.txt

      - name: 🗜️ Build JAR
        run: |
          jar cfm gestion-stock.jar manifest.txt \
            -C out . \
            -C inventory lib

      - name: 🚀 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-jar
          path: gestion-stock.jar
          retention-days: 30
