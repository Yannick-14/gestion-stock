name: "CodeQL — Security Analysis"

# Analyse de sécurité CodeQL
# Se déclenche :
#   - à chaque ouverture / mise à jour de PR vers main
#   - à chaque push sur main
#   - toutes les semaines (dimanche 01h45) pour détecter les nouvelles CVE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '45 1 * * 0'

jobs:
  analyze:
    name: 🔐 CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Activer les requêtes de sécurité étendues
          queries: security-extended

      # Build manuel nécessaire pour java-kotlin en mode manual
      - name: 🔨 Build for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          mkdir -p out
          find inventory -name "*.java" -not -path "*/lib/*" > sources.txt
          javac \
            -cp "inventory/lib/postgresql-42.3.7.jar" \
            -d out \
            @sources.txt

      - name: 🔐 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
